name: edtech_application
description: A Bangla-first, API-connected Phase-1 LMS application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Later 7.x releases reference an iOS 26 NWPath API; 7.0.0 keeps LiveKit's
  # required API range while remaining compatible with production Xcode 16.4.
  connectivity_plus: 7.0.0
  crypto: ^3.0.7
  # LiveKit permits 12.3+; newer releases call an Xcode 26-only selector.
  device_info_plus: 12.3.0
  dio: ^5.11.0
  freezed_annotation: ^3.1.0
  # 10.3.1 retains the same storage API and shares device_info_plus' Win32
  # dependency range; 11.x currently conflicts with the Xcode-compatible pin.
  flutter_secure_storage: ^10.3.1
  hugeicons: ^1.1.7
  json_annotation: ^4.12.0
  livekit_client: ^2.9.0
  provider: ^6.1.5+1
  path_provider: ^2.1.6
  retrofit: ^4.9.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  file_selector: ^1.1.0
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.8

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
        - asset: assets/fonts/Inter-Italic-Variable.ttf
          style: italic
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Variable.ttf
