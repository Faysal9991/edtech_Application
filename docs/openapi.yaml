openapi: 3.1.0
info:
  title: LMS Service API
  version: 1.0.0
  description: Bangladesh-focused LMS REST API for hybrid education operations. Timestamps are UTC and money uses integer minor units. Organization-scoped authenticated operations select an active membership with the optional X-Organization-ID UUID request header; when omitted, the first active membership in deterministic organization-name order is used. Clients discover safe choices from AuthUser.memberships.
servers:
  - url: /
security:
  - BearerAuth: []
tags:
  - {name: Authentication}
  - {name: Users}
  - {name: Academic catalogue}
  - {name: Batches}
  - {name: Guardians}
  - {name: Branch operations}
  - {name: Physical attendance}
  - {name: Curriculum versioning}
  - {name: Written assessment, description: 'Exact fixed-point rubric grading, immutable grading versions, moderation, and recheck review.'}
  - {name: Admission coaching}
  - {name: Mastery and interventions}
  - {name: Academic doubts}
  - {name: Study planning}
  - {name: Offline learning}
  - {name: SMS contacts}
  - {name: Admit cards and seating}
  - {name: Teacher workspace, description: 'Requires an authenticated active membership with teacher-namespace access; course, batch, student, and ownership policies remain enforced, while administrative assignment and moderation operations stay under /api/v1/admin.'}
  - {name: Student mobile}
  - {name: Courses}
  - {name: Media}
  - {name: Learning}
  - {name: Assessments}
  - {name: Live classes}
  - {name: Payments}
  - {name: Notifications}
  - {name: Reporting}
paths:
  /health/live:
    get: {operationId: liveness, security: [], responses: {'200': {$ref: '#/components/responses/OK'}}}
  /health/ready:
    get: {operationId: readiness, security: [], responses: {'200': {$ref: '#/components/responses/OK'}, '503': {$ref: '#/components/responses/Problem'}}}
  /metrics:
    get: {operationId: metrics, security: [], responses: {'200': {description: Prometheus exposition, content: {text/plain: {schema: {type: string}}}}}}
  /openapi.yaml:
    get: {operationId: openAPISpec, security: [], responses: {'200': {description: OpenAPI document}}}
  /docs:
    get: {operationId: swaggerUI, security: [], responses: {'200': {description: Swagger UI}}}

  /api/v1/auth/register:
    post:
      operationId: register
      tags: [Authentication]
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}, example: {email: student@example.com, password: a-long-unique-passphrase, display_name: Example Student}}}}
      responses: {'201': {description: Pending account created, content: {application/json: {schema: {$ref: '#/components/schemas/RegistrationResponse'}}}}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}, example: {email: student@example.com, password: a-long-unique-passphrase}}}}
      responses: {'200': {$ref: '#/components/responses/Tokens'}, '401': {$ref: '#/components/responses/Problem'}, '429': {$ref: '#/components/responses/Problem'}}
  /api/v1/auth/refresh:
    post: {operationId: refresh, tags: [Authentication], security: [], requestBody: {$ref: '#/components/requestBodies/RefreshToken'}, responses: {'200': {$ref: '#/components/responses/Tokens'}, '401': {$ref: '#/components/responses/Problem'}}}
  /api/v1/auth/logout:
    post: {operationId: logout, tags: [Authentication], requestBody: {$ref: '#/components/requestBodies/RefreshToken'}, responses: {'204': {description: Current session revoked}, '401': {$ref: '#/components/responses/Problem'}}}
  /api/v1/auth/logout-all:
    post: {operationId: logoutAll, tags: [Authentication], responses: {'204': {description: All sessions revoked}, '401': {$ref: '#/components/responses/Problem'}}}
  /api/v1/auth/me:
    get: {operationId: currentUser, tags: [Authentication], responses: {'200': {description: Current user, content: {application/json: {schema: {$ref: '#/components/schemas/AuthUser'}}}}, '401': {$ref: '#/components/responses/Problem'}}}
  /api/v1/auth/change-password:
    post: {operationId: changePassword, tags: [Authentication], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangePasswordRequest'}}}}, responses: {'204': {description: Password changed and sessions revoked}, '422': {$ref: '#/components/responses/Problem'}}}
  /api/v1/auth/forgot-password:
    post: {operationId: forgotPassword, tags: [Authentication], security: [], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}, example: {email: student@example.com}}}}, responses: {'202': {description: Generic accepted response}, '429': {$ref: '#/components/responses/Problem'}}}
  /api/v1/auth/reset-password:
    post: {operationId: resetPassword, tags: [Authentication], security: [], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResetPasswordRequest'}}}}, responses: {'204': {description: Password reset}, '401': {$ref: '#/components/responses/Problem'}}}
  /api/v1/auth/verify-email:
    post: {operationId: verifyEmail, tags: [Authentication], security: [], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TokenRequest'}}}}, responses: {'204': {description: Email verified}, '401': {$ref: '#/components/responses/Problem'}}}
  /api/v1/auth/resend-verification:
    post: {operationId: resendVerification, tags: [Authentication], security: [], description: Enumeration-safe and limited to five requests per source per hour., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}}}}, responses: {'202': {description: Same accepted response whether or not an unverified account exists, content: {application/json: {schema: {$ref: '#/components/schemas/AcceptedMessage'}}}}, '429': {$ref: '#/components/responses/Problem'}}}

  /api/v1/academic/programs:
    get: {operationId: listAcademicPrograms, tags: [Academic catalogue], security: [], responses: {'200': {$ref: '#/components/responses/AcademicList'}}}
  /api/v1/academic/levels:
    get: {operationId: listAcademicLevels, tags: [Academic catalogue], security: [], parameters: [{name: program_id, in: query, schema: {$ref: '#/components/schemas/UUID'}}], responses: {'200': {$ref: '#/components/responses/AcademicList'}}}
  /api/v1/academic/classes:
    get: {operationId: listAcademicClasses, tags: [Academic catalogue], security: [], parameters: [{name: level_id, in: query, schema: {$ref: '#/components/schemas/UUID'}}], responses: {'200': {$ref: '#/components/responses/AcademicList'}}}
  /api/v1/academic/boards:
    get: {operationId: listAcademicBoards, tags: [Academic catalogue], security: [], responses: {'200': {$ref: '#/components/responses/AcademicList'}}}
  /api/v1/academic/groups:
    get: {operationId: listAcademicGroups, tags: [Academic catalogue], security: [], parameters: [{name: program_id, in: query, schema: {$ref: '#/components/schemas/UUID'}}], responses: {'200': {$ref: '#/components/responses/AcademicList'}}}
  /api/v1/academic/subjects:
    get: {operationId: listAcademicSubjects, tags: [Academic catalogue], security: [], parameters: [{name: program_id, in: query, schema: {$ref: '#/components/schemas/UUID'}}], responses: {'200': {$ref: '#/components/responses/AcademicList'}}}
  /api/v1/academic/subjects/{id}/chapters:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: listAcademicChapters, tags: [Academic catalogue], security: [], responses: {'200': {$ref: '#/components/responses/AcademicList'}, '404': {$ref: '#/components/responses/Problem'}}}
  /api/v1/academic/chapters/{id}/topics:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: listAcademicTopics, tags: [Academic catalogue], security: [], responses: {'200': {$ref: '#/components/responses/AcademicList'}, '404': {$ref: '#/components/responses/Problem'}}}
  /api/v1/academic/exam-targets:
    get: {operationId: listAcademicExamTargets, tags: [Academic catalogue], security: [], parameters: [{name: program_id, in: query, schema: {$ref: '#/components/schemas/UUID'}}], responses: {'200': {$ref: '#/components/responses/AcademicList'}}}
  /api/v1/academic/sessions:
    get: {operationId: listAcademicSessions, tags: [Academic catalogue], security: [], responses: {'200': {$ref: '#/components/responses/AcademicList'}}}
  /api/v1/admin/academic/{kind}:
    parameters: [{name: kind, in: path, required: true, schema: {type: string, enum: [programs, levels, classes, boards, groups, subjects, chapters, topics, exam-targets, sessions]}}]
    get: {operationId: adminListAcademicItems, tags: [Academic catalogue], responses: {'200': {$ref: '#/components/responses/AcademicList'}, '403': {$ref: '#/components/responses/Problem'}}}
    post: {operationId: adminCreateAcademicItem, tags: [Academic catalogue], requestBody: {$ref: '#/components/requestBodies/AcademicWrite'}, responses: {'201': {$ref: '#/components/responses/AcademicItem'}, '403': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/academic/{kind}/{id}:
    parameters: [{name: kind, in: path, required: true, schema: {type: string, enum: [programs, levels, classes, boards, groups, subjects, chapters, topics, exam-targets, sessions]}}, {$ref: '#/components/parameters/ID'}]
    get: {operationId: adminGetAcademicItem, tags: [Academic catalogue], responses: {'200': {$ref: '#/components/responses/AcademicItem'}, '404': {$ref: '#/components/responses/Problem'}}}
    patch: {operationId: adminUpdateAcademicItem, tags: [Academic catalogue], requestBody: {$ref: '#/components/requestBodies/AcademicWrite'}, responses: {'200': {$ref: '#/components/responses/AcademicItem'}, '403': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}}
    delete: {operationId: adminDeleteAcademicItem, tags: [Academic catalogue], responses: {'204': {description: Organization-owned academic item deleted}, '409': {$ref: '#/components/responses/Problem'}}}

  /api/v1/guardian/invitations/accept:
    post: {operationId: acceptGuardianInvitation, tags: [Guardians], security: [{}, {BearerAuth: []}], description: Accepts one expiring single-use invitation. Existing users authenticate; new guardians set their initial password through the invite., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GuardianInvitationAccept'}}}}, responses: {'200': {description: Active student relationship, content: {application/json: {schema: {$ref: '#/components/schemas/StudentGuardian'}}}}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}, '429': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/students/{studentId}/guardians:
    parameters: [{name: studentId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}]
    get: {operationId: adminListStudentGuardians, tags: [Guardians], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/GuardianList'}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/students/{studentId}/guardians/invitations:
    parameters: [{name: studentId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}]
    post: {operationId: adminCreateGuardianInvitation, tags: [Guardians], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GuardianInvitationWrite'}}}}, responses: {'201': {description: Invitation queued without exposing production token material, content: {application/json: {schema: {$ref: '#/components/schemas/GuardianInvitationResponse'}}}}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/student-guardians/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete: {operationId: adminRevokeStudentGuardian, tags: [Guardians], description: Revocation is database-authoritative and denies the next request immediately., responses: {'204': {description: Link revoked}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/guardian-invitations/{id}/resend:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: adminResendGuardianInvitation, tags: [Guardians], description: Rotates the single-use token and queues one deduplicated invitation event., responses: {'200': {description: Rotated invitation without production token exposure, content: {application/json: {schema: {$ref: '#/components/schemas/GuardianInvitationResponse'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/guardian/dashboard:
    get: {operationId: guardianDashboard, tags: [Guardians], responses: {'200': {description: Linked-student aggregate dashboard, content: {application/json: {schema: {$ref: '#/components/schemas/GuardianDashboard'}}}}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}}}
  /api/v1/guardian/students:
    get: {operationId: guardianListStudents, tags: [Guardians], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/GuardianStudentList'}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}}}
  /api/v1/guardian/students/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: guardianGetStudent, tags: [Guardians], responses: {'200': {description: Allowlisted linked-student summary, content: {application/json: {schema: {$ref: '#/components/schemas/GuardianStudentSummary'}}}}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}}
  /api/v1/guardian/students/{id}/attendance:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: guardianGetStudentAttendance, tags: [Guardians, Physical attendance], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/GuardianAttendanceList'}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}}
  /api/v1/guardian/students/{id}/progress:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: guardianGetStudentProgress, tags: [Guardians], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {description: Linked-student course progress, content: {application/json: {schema: {$ref: '#/components/schemas/GuardianProgressList'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}}
  /api/v1/guardian/students/{id}/results:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: guardianGetStudentResults, tags: [Guardians], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {description: Linked-student published/calculated course results, content: {application/json: {schema: {$ref: '#/components/schemas/GuardianResultList'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}}
  /api/v1/guardian/students/{id}/calendar:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: guardianGetStudentCalendar, tags: [Guardians], parameters: [{$ref: '#/components/parameters/ReportFrom'}, {$ref: '#/components/parameters/ReportTo'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {description: Linked-student calendar capped at 366 days, content: {application/json: {schema: {$ref: '#/components/schemas/StudentCalendar'}}}}, '403': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}}

  /api/v1/admin/branches:
    get: {operationId: adminListBranches, tags: [Branch operations], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {name: status, in: query, schema: {type: string, enum: [active, inactive, archived]}}], responses: {'200': {$ref: '#/components/responses/BranchList'}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}}}
    post: {operationId: adminCreateBranch, tags: [Branch operations], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BranchWrite'}}}}, responses: {'201': {$ref: '#/components/responses/Branch'}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/branches/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: adminGetBranch, tags: [Branch operations], responses: {'200': {$ref: '#/components/responses/Branch'}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}}
    patch: {operationId: adminUpdateBranch, tags: [Branch operations], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BranchWrite'}}}}, responses: {'200': {$ref: '#/components/responses/Branch'}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}}
    delete: {operationId: adminArchiveBranch, tags: [Branch operations], responses: {'204': {description: Branch archived without deleting history}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/branches/{id}/classrooms:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: adminListClassrooms, tags: [Branch operations], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/ClassroomList'}, '403': {$ref: '#/components/responses/Problem'}}}
    post: {operationId: adminCreateClassroom, tags: [Branch operations], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClassroomWrite'}}}}, responses: {'201': {$ref: '#/components/responses/Classroom'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/classrooms/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch: {operationId: adminUpdateClassroom, tags: [Branch operations], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClassroomWrite'}}}}, responses: {'200': {$ref: '#/components/responses/Classroom'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}}
    delete: {operationId: adminArchiveClassroom, tags: [Branch operations], responses: {'204': {description: Classroom archived}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/class-sessions:
    get: {operationId: adminListClassSessions, tags: [Branch operations], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {name: branch_id, in: query, schema: {$ref: '#/components/schemas/UUID'}}, {name: batch_id, in: query, schema: {$ref: '#/components/schemas/UUID'}}, {name: from, in: query, schema: {$ref: '#/components/schemas/Timestamp'}}, {name: to, in: query, schema: {$ref: '#/components/schemas/Timestamp'}}], responses: {'200': {$ref: '#/components/responses/ClassSessionList'}, '403': {$ref: '#/components/responses/Problem'}}}
    post: {operationId: adminCreateClassSession, tags: [Branch operations], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClassSessionWrite'}}}}, responses: {'201': {$ref: '#/components/responses/ClassSession'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/class-sessions/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch: {operationId: adminUpdateClassSession, tags: [Branch operations], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClassSessionWrite'}}}}, responses: {'200': {$ref: '#/components/responses/ClassSession'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/class-sessions/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: adminCancelClassSession, tags: [Branch operations], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonWrite'}}}}, responses: {'200': {$ref: '#/components/responses/ClassSession'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/class-sessions/{id}/reschedule:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: adminRescheduleClassSession, tags: [Branch operations], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClassRescheduleWrite'}}}}, responses: {'200': {$ref: '#/components/responses/ClassSession'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/class-sessions/{id}/substitute:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: adminSubstituteClassTeacher, tags: [Branch operations], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClassTeacherSubstitutionWrite'}}}}, responses: {'200': {description: Active substitute assignment, content: {application/json: {schema: {$ref: '#/components/schemas/ClassTeacherAssignment'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/batch-enrollments/{id}/transfer:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: adminTransferBatchEnrollment, tags: [Branch operations, Batches], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BatchTransferWrite'}}}}, responses: {'200': {description: Active enrollment in target batch, content: {application/json: {schema: {$ref: '#/components/schemas/BatchEnrollment'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}}
  /api/v1/teacher/class-sessions:
    get: {operationId: teacherListClassSessions, tags: [Branch operations, Teacher workspace], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/ClassSessionList'}, '403': {$ref: '#/components/responses/Problem'}}}
  /api/v1/teacher/availability:
    get: {operationId: teacherListAvailability, tags: [Branch operations, Teacher workspace], description: Lists explicit availability windows. Unavailable windows prevent overlapping class assignments; recurrence rules are intentionally unsupported., parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {name: from, in: query, schema: {$ref: '#/components/schemas/Timestamp'}}, {name: to, in: query, schema: {$ref: '#/components/schemas/Timestamp'}}], responses: {'200': {description: Bounded availability windows, content: {application/json: {schema: {$ref: '#/components/schemas/TeacherAvailabilityList'}}}}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}}}
    post: {operationId: teacherCreateAvailability, tags: [Branch operations, Teacher workspace], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TeacherAvailabilityWrite'}}}}, responses: {'201': {description: Created explicit availability window, content: {application/json: {schema: {$ref: '#/components/schemas/TeacherAvailability'}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}}
  /api/v1/teacher/availability/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete: {operationId: teacherDeleteAvailability, tags: [Branch operations, Teacher workspace], responses: {'204': {description: Availability window deleted}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}}
  /api/v1/admin/curricula:
    get: {operationId: adminListCurricula, tags: [Academic catalogue], parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/StatusFilter'}], responses: {'200': {description: Versioned curricula, content: {application/json: {schema: {$ref: '#/components/schemas/CurriculumList'}}}}, '403': {$ref: '#/components/responses/Problem'}}}
