components:
  securitySchemes:
    BearerAuth: {type: http, scheme: bearer, bearerFormat: JWT, description: Short-lived LMS access JWT. Refresh tokens are accepted only by refresh/logout.}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Slug: {name: slug, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 180}}
    CourseID: {name: course_id, in: query, required: true, schema: {type: string, format: uuid}}
    Cursor: {name: cursor, in: query, schema: {type: string}, description: Opaque timestamp and UUID tie-breaker.}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    ReportFrom: {name: from, in: query, schema: {type: string, format: date-time}}
    ReportTo: {name: to, in: query, schema: {type: string, format: date-time}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
    CourseFilter: {name: course_id, in: query, schema: {$ref: '#/components/schemas/UUID'}}
    BatchFilter: {name: batch_id, in: query, schema: {$ref: '#/components/schemas/UUID'}}
    StatusFilter: {name: status, in: query, schema: {type: string}}
  requestBodies:
    CourseWrite: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CourseWrite'}, example: {title: Production Go, slug: production-go, description: Practical Go systems., language: en, level: intermediate, is_free: true, price_minor: 0, currency: BDT, version: 0}}}}
    AcademicWrite: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AcademicWrite'}}}}
    BatchWrite: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BatchWrite'}}}}
    BatchScheduleWrite: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BatchScheduleWrite'}}}}
    RefreshToken: {required: true, content: {application/json: {schema: {type: object, required: [refresh_token], additionalProperties: false, properties: {refresh_token: {type: string, minLength: 32, maxLength: 256, writeOnly: true}}}}}}
  responses:
    OK: {description: Successful response, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
    List: {description: Cursor-paginated list, content: {application/json: {schema: {$ref: '#/components/schemas/ListResponse'}}}}
    Course: {description: Course, content: {application/json: {schema: {$ref: '#/components/schemas/Course'}}}}
    AcademicItem: {description: Academic catalogue item, content: {application/json: {schema: {$ref: '#/components/schemas/AcademicItem'}}}}
    AcademicList: {description: Deterministically ordered bounded academic catalogue, content: {application/json: {schema: {$ref: '#/components/schemas/AcademicList'}}}}
    Batch: {description: Coaching batch, content: {application/json: {schema: {$ref: '#/components/schemas/Batch'}}}}
    BatchList: {description: Cursor-paginated coaching batches, content: {application/json: {schema: {$ref: '#/components/schemas/BatchList'}}}}
    GuardianList: {description: Active and historical guardian links, content: {application/json: {schema: {$ref: '#/components/schemas/StudentGuardianList'}}}}
    GuardianStudentList: {description: Students actively linked to the authenticated guardian, content: {application/json: {schema: {$ref: '#/components/schemas/GuardianStudentList'}}}}
    GuardianAttendanceList: {description: Guardian-safe attendance history for one linked student, content: {application/json: {schema: {$ref: '#/components/schemas/GuardianAttendanceList'}}}}
    PhysicalAttendanceList: {description: Physical attendance records, content: {application/json: {schema: {$ref: '#/components/schemas/PhysicalAttendanceList'}}}}
    Branch: {description: Branch, content: {application/json: {schema: {$ref: '#/components/schemas/Branch'}}}}
    BranchList: {description: Cursor-paginated organization branches, content: {application/json: {schema: {$ref: '#/components/schemas/BranchList'}}}}
    Classroom: {description: Classroom, content: {application/json: {schema: {$ref: '#/components/schemas/Classroom'}}}}
    ClassroomList: {description: Cursor-paginated branch classrooms, content: {application/json: {schema: {$ref: '#/components/schemas/ClassroomList'}}}}
    ClassSession: {description: 'Scheduled physical, online, or hybrid class session', content: {application/json: {schema: {$ref: '#/components/schemas/ClassSession'}}}}
    ClassSessionList: {description: Bounded class-session list, content: {application/json: {schema: {$ref: '#/components/schemas/ClassSessionList'}}}}
    AttendanceSession: {description: Physical attendance session, content: {application/json: {schema: {$ref: '#/components/schemas/AttendanceSession'}}}}
    Problem: {description: RFC 7807 problem details, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
